name: logsentinel
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logsentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d logsentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/logsentinel
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-logsentinel@localhost}
      SMTP_TLS: ${SMTP_TLS:-true}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - job_data:/app/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    volumes:
      - job_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    command: ["logsentinel", "worker"]
    volumes:
      - job_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from app.db import SessionLocal,utcnow; from app.models import WorkerHeartbeat; from sqlalchemy import select; from datetime import timedelta; s=SessionLocal(); assert s.scalar(select(WorkerHeartbeat).where(WorkerHeartbeat.last_seen>utcnow()-timedelta(seconds=90)))"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
  job_data:
